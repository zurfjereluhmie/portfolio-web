# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # Pick your own package manager and build script
      - run: npm ci
      - run: npm run generate
        env:
          NITRO_PRESET: github_pages
      - name: Verify deployment output
        run: |
          js_count=$(ls .output/public/_nuxt/*.js 2>/dev/null | wc -l)
          css_count=$(ls .output/public/_nuxt/*.css 2>/dev/null | wc -l)
          if [ "$js_count" -eq 0 ] || [ "$css_count" -eq 0 ]; then
            echo "::error::_nuxt directory is missing JS or CSS bundles. The build is broken."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public

  deploy:
    needs: build
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
