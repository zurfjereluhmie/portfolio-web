name: Build Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NITRO_PRESET: github_pages
      - name: Ensure client assets are in output
        run: |
          if [ ! -d ".output/public/_nuxt" ] || [ -z "$(ls -A .output/public/_nuxt)" ]; then
            echo "::warning::_nuxt assets missing from .output/public — copying from build cache"
            cp -r node_modules/.cache/nuxt/.nuxt/dist/client/_nuxt .output/public/_nuxt
          fi
      - name: Ensure public assets are in output
        run: |
          cp -rn public/* .output/public/ 2>/dev/null || true
      - name: Verify deployment output
        run: |
          echo "Checking .output/public/_nuxt contains JS/CSS bundles..."
          js_count=$(ls .output/public/_nuxt/*.js 2>/dev/null | wc -l)
          css_count=$(ls .output/public/_nuxt/*.css 2>/dev/null | wc -l)
          echo "  JS files:  $js_count"
          echo "  CSS files: $css_count"
          if [ "$js_count" -eq 0 ] || [ "$css_count" -eq 0 ]; then
            echo "::error::_nuxt directory is missing JS or CSS bundles. The build is broken."
            exit 1
          fi
          echo "Checking public assets (images, favicons)..."
          if [ ! -d ".output/public/img" ]; then
            echo "::error::.output/public/img directory is missing. Static assets were not copied."
            exit 1
          fi
          img_count=$(find .output/public/img -type f 2>/dev/null | wc -l)
          echo "  Image files: $img_count"
          if [ "$img_count" -eq 0 ]; then
            echo "::error::.output/public/img directory is empty."
            exit 1
          fi
          echo "Checking that HTML files reference the built assets..."
          for html in .output/public/index.html .output/public/200.html; do
            if [ -f "$html" ] && ! grep -q '/_nuxt/' "$html"; then
              echo "::error::$html does not reference any _nuxt assets."
              exit 1
            fi
          done
          echo "Deployment output looks correct."
